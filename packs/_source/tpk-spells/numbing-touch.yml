name: Numbing Touch
type: spell
img: icons/magic/death/hand-withered-gray.webp
folder: null
sort: 0
system:
  description:
    value: >-
      <p>Your hand crackles with frigid undeath. Make a melee spell attack — on
      a hit, you may instead force the target to make a Wisdom saving throw. On
      a failed save, the target takes 1d8 cold damage and has disadvantage on
      the next saving throw it makes before the end of its next turn. On a
      successful save, it takes half damage and no debuff.</p> <p><em>At higher
      levels:</em> 2d8 at 5th, 3d8 at 11th, 4d8 at 17th.</p>
