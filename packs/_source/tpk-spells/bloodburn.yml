name: Bloodburn
type: spell
img: icons/magic/fire/explosion-fireball-medium-red-orange.webp
folder: null
sort: 0
system:
  description:
    value: >-
      <p>You inflict a burning pain upon yourself, causing another creature
      that you can see within range to feel an even more excruciating pain as
      their blood boils. As you cast the spell, you must spend a number of hit
      points (minimum 1, maximum your current HP &minus; 1). The creature must
      then make a Constitution saving throw. On a failed save, the creature
      takes 2d6 + the number of hit points spent as fire damage, and
      immediately falls prone as they become wracked with pain. On a
      successful save, the target takes half as much damage and doesn&rsquo;t
      fall prone.</p> <p><em>Constructs, elementals, and undead are immune to
      this spell.</em></p> <p><strong>At Higher Levels.</strong> When you cast
      this spell using a spell slot of 2nd level or higher, the damage
      increases by 1d6 for each slot level above 1st.</p>
